spring:
  application:
    name: exe

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - ${DESKTOP_APP_URL:http://localhost:1420}
      - ${WEB_APP_URL:http://localhost:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Request-Id
    allow-credentials: true
    max-age: 3600

  security:
    oauth2:
      frontend-redirect-url: ${FRONTEND_REDIRECT_URL:http://localhost:1420/}
    jwt:
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
      refresh-hash-secret: ${JWT_HASH_REFRESH_SECRET:kP8mX3vQzR5tW1bB9nF7jK4sC0dE2gH6YuUoLI1A=}
      access-expiration-ms: 900000
      refresh-expiration-ms: 2592000000

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  rate-limit:
    enable: true
    requests-per-minute: 100

  otp:
    expire-minutes: 5
    length: 6
    max-attempts: 5

  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Focus Buddy}

  cookie:
    secure: ${COOKIE_SECURE:false}
    refresh-max-age: 2592000
    same-site: Lax

  seed:
    default-pet-code: "MONKI"
    default-personality-code: "SWEET"
    daily-free-usage: 60
    default-cycle-minutes: 5
    subscription-plans:
      - code: "FREE"
        name: "Free"
        description: "Basic focus plan with daily usage limit."
        plan: "FREE"
        billing-cycle: "NONE"
        price-vnd: 0
        daily-limit-minutes: 60
        unlimited-usage: false
        active: true
        display-order: 1
      - code: "PRO_MONTHLY"
        name: "Pro Monthly"
        description: "Unlimited focus time for 1 month."
        plan: "PRO"
        billing-cycle: "MONTHLY"
        price-vnd: 49000
        duration-days: 30
        unlimited-usage: true
        active: true
        display-order: 2
      - code: "PRO_YEARLY"
        name: "Pro Yearly"
        description: "Unlimited focus time for 1 year."
        plan: "PRO"
        billing-cycle: "YEARLY"
        price-vnd: 399000
        duration-days: 365
        unlimited-usage: true
        active: true
        display-order: 3
    personalities:
      - code: "SWEET"
        name: "Sweet Assistant"
        description: "Always encouraging, gentle, and positive."
        premium: false
      - code: "STRICT"
        name: "Strict Assistant"
        description: "Disciplined, straightforward, and unyielding."
        premium: false
      - code: "MEAN"
        name: "Mean Assistant"
        description: "Challenging, provocative, and roasts your ego mercilessly."
        premium: true
      - code: "GRUMPY"
        name: "Grumpy Assistant"
        description: "Blunt, impatient, and brutally direct, but still genuinely helpful."
        premium: true
    pets:
      - code: "MONKI"
        name: "Monkey"
        description: "A playful and mischievous companion that loves to swing from trees and eat bananas."
        premium: false
        image-url: "https://res.cloudinary.com/dlkcf2b8w/image/upload/v1781511641/MONKI_vtf7p6.png"
      - code: "PANDO"
        name: "Panda"
        description: "A gentle and cuddly companion that loves to eat bamboo and nap in the sun."
        premium: false
        image-url: "https://res.cloudinary.com/dlkcf2b8w/image/upload/v1781511641/PANDO_gs0n1c.png"
      - code: "PIGGY"
        name: "Pig"
        description: "A cute and friendly companion that loves to roll in the mud and eat snacks."
        premium: true
        image-url: "https://res.cloudinary.com/dlkcf2b8w/image/upload/v1781511641/PIGGY_kky3tf.png"
      - code: "FROGI"
        name: "Frog"
        description: "A lively and energetic companion that loves to hop around and catch flies."
        premium: true
        image-url: "https://res.cloudinary.com/dlkcf2b8w/image/upload/v1781511641/FROGI_dxvowf.png"
    app-rules:
      - app-name: "TikTok"
        window-title-keyword: "tiktok"
        rule-type: BLACKLIST
      - app-name: "Facebook"
        window-title-keyword: "facebook"
        rule-type: BLACKLIST
      - app-name: "Instagram"
        window-title-keyword: "instagram"
        rule-type: BLACKLIST
      - app-name: "Netflix"
        window-title-keyword: "netflix"
        rule-type: BLACKLIST
      - app-name: "Steam"
        window-title-keyword: "steam"
        rule-type: BLACKLIST
      - app-name: "Riot Client"
        window-title-keyword: "riot client"
        rule-type: BLACKLIST
      - app-name: "Visual Studio Code"
        window-title-keyword: "visual studio code"
        rule-type: WHITELIST
      - app-name: "Antigravity IDE"
        window-title-keyword: "antigravity ide"
        rule-type: WHITELIST
      - app-name: "IntelliJ IDEA"
        window-title-keyword: "intellij idea"
        rule-type: WHITELIST
      - app-name: "Google Docs"
        window-title-keyword: "docs.google"
        rule-type: WHITELIST
      - app-name: "Notion"
        window-title-keyword: "notion"
        rule-type: WHITELIST

  ai-cloud:
    base-url: https://openrouter.ai/api/v1
    api-key: ${AI_CLOUD_API_KEY}
    model: "google/gemini-2.5-flash"
    timeout-seconds: 10
    max-tokens: 300
