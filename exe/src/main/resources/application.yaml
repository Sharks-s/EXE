spring:
  application:
    name: exe

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - ${DESKTOP_APP_URL:http://localhost:1420}
      - ${WEB_APP_URL:http://localhost:3000}
      - http://tauri.localhost
      - https://tauri.localhost
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Request-Id
    allow-credentials: true
    max-age: 3600

  security:
    oauth2:
      desktop-redirect-url: ${DESKTOP_APP_URL:http://localhost:1420/}
    jwt:
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
      refresh-hash-secret: ${JWT_HASH_REFRESH_SECRET:kP8mX3vQzR5tW1bB9nF7jK4sC0dE2gH6YuUoLI1A=}
      access-expiration-ms: 900000
      refresh-expiration-ms: 2592000000

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  rate-limit:
    enable: true
    requests-per-minute: 100

  otp:
    expire-minutes: 5
    length: 6
    max-attempts: 5

  mail:
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Focus Buddy}
    test-recipient: ${RESEND_TEST_RECIPIENT:}

  cookie:
    secure: ${COOKIE_SECURE:false}
    refresh-max-age: 2592000
    same-site: ${COOKIE_SAME_SITE:Lax}

  seed:
    default-pet-code: "MONKI"
    default-personality-code: "SWEET"
    daily-free-usage: 60
    default-cycle-minutes: 5
    subscription-plans:
      - code: "FREE"
        name: "Free"
        description: "Basic focus plan with daily usage limit."
        plan: "FREE"
        billing-cycle: "NONE"
        price-vnd: 0
        daily-limit-minutes: 60
        unlimited-usage: false
        active: true
        display-order: 1
      - code: "PRO_MONTHLY"
        name: "Pro Monthly"
        description: "Unlimited focus time for 1 month."
        plan: "PRO"
        billing-cycle: "MONTHLY"
        price-vnd: 49000
        duration-days: 30
        unlimited-usage: true
        active: true
        display-order: 2
      - code: "PRO_YEARLY"
        name: "Pro Yearly"
        description: "Unlimited focus time for 1 year."
        plan: "PRO"
        billing-cycle: "YEARLY"
        price-vnd: 399000
        duration-days: 365
        unlimited-usage: true
        active: true
        display-order: 3
    personalities:
      - code: "SWEET"
        name: "Sweet Assistant"
        description: "Always encouraging, gentle, and positive."
        premium: false
      - code: "STRICT"
        name: "Strict Assistant"
