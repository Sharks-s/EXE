#            user-name-attribute: sub
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:1420
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Request-Id
    allow-credentials: true
    max-age: 3600

  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
      refresh-hash-secret: ${JWT_HASH_REFRESH_SECRET}
      access-expiration-ms: 900000
      refresh-expiration-ms: 2592000000

  rate-limit:
    enable: true
    requests-per-minute: 100

  otp:
    expire-minutes: 5
    length: 6
    max-attempts: 5

  cookie:
    secure: false
    refresh-max-age: 2592000
    same-site: Lax
